[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "doc-digitalization"
version = "2.0.0"
description = "Agent-first document extraction and generation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.26.0",
  "anthropic>=0.18.0",
  "PyMuPDF>=1.23.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "pdfplumber>=0.10.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0.0",
  "python-dateutil>=2.8.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.0",
]

[project.optional-dependencies]
agent-sdk = [
  "claude-agent-sdk>=0.1.0",
]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "black>=24.0.0",
  "isort>=5.13.0",
  "mypy>=1.8.0",
  "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
