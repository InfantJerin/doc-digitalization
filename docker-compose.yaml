version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_MODEL=${AGENT_MODEL:-claude-sonnet-4-20250514}
      - AGENT_PERMISSION_MODE=${AGENT_PERMISSION_MODE:-bypassPermissions}
      - DMS_BASE_URL=http://dms:8080
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/doc_digitalization}
      - EXTRACTIONS_ROOT=/tmp/extractions
    depends_on:
      - db
      - dms
    volumes:
      - ./config:/app/config:ro
      - ./skills:/app/skills:ro
      - ./src:/app/src:ro

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=doc_digitalization
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dms:
    image: python:3.11-slim
    command: python -m http.server 8080
    ports:
      - "8080:8080"
    volumes:
      - ./resources:/app/resources:ro

volumes:
  postgres_data:
